name: Generate contribution snake

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate yearly contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23ff4ecd&color_dots=%23ebedf0,%23c4b5fd,%237dd3fc,%23c084fc,%23f472b6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23ff4ecd&color_dots=%23161b22,%233b2a63,%230e7490,%237e22ce,%23db2777

      - name: Publish snake assets
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
