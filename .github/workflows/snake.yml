name: Generate contribution arcade game

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate yearly contribution game
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PROFILE_CONTRIBUTIONS_TOKEN }}
          games: "pacman"
          player_style: "opportunistic"
          hide_month_labels: "false"

      - name: Publish game assets
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
